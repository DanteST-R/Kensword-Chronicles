<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kensword Chronicles — Compêndio do Aventureiro</title>
  <meta name="description" content="O compêndio oficial do RPG medieval Kensword Chronicles.">
  <!-- Favicon Medieval Otimizado -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
  <!-- Firebase SDK Compat (via CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css?v=1.3">
  <link rel="stylesheet" href="auth.css?v=1.3">
  
  <!-- Templates HTML Modularizados -->
  <script src="components/auth_portal_template.js"></script>
  <script src="components/tab_contents_template.js"></script>
</head>
<body>

<!-- O Portal da Guilda será injetado dinamicamente para manter o HTML modularizado -->
<div id="auth-portal-container"></div>
<script>
  document.getElementById('auth-portal-container').outerHTML = KENSWORD_TEMPLATES.authPortal;
</script>

<div class="auth-toast" id="auth-toast"></div>

<!-- ===================================================== -->
<!-- COMPÊNDIO PRINCIPAL                                   -->
<!-- ===================================================== -->
<header>
  <div class="header-content">
    <div class="profile-avatar" onclick="goToProfileTab()"><img id="header-user-avatar" src="Photos/demihuman.webp" alt="Avatar" /></div>
    <div class="header-emblem">⚔️</div>
    <h1 class="site-title">Kensword Chronicles</h1>
    <p class="site-subtitle">Compêndio do Aventureiro — Continente de Kensword</p>
    <div class="header-divider"><span>✦</span></div>
  </div>
</header>

<nav id="main-nav">
  <button class="nav-tab active" onclick="showTab('history')" id="tab-history"><span class="nav-icon">📜</span>História</button>
  <button class="nav-tab" onclick="showTab('races')" id="tab-races"><span class="nav-icon">🧬</span>Raças</button>
  <button class="nav-tab" onclick="showTab('learn-abilities')" id="tab-learn-abilities"><span class="nav-icon">🛡️</span>Habilidades</button>
  <button class="nav-tab" onclick="showTab('elements')" id="tab-elements"><span class="nav-icon">✨</span>Elementos</button>
  <button class="nav-tab" onclick="showTab('map')" id="tab-map"><span class="nav-icon">🗺️</span>Localizações</button>
  <button class="nav-tab" onclick="showTab('characters')" id="tab-characters"><span class="nav-icon">🧑‍🤝‍🧑</span>Personagens</button>
  <button class="nav-tab" onclick="showTab('npcs')" id="tab-npcs"><span class="nav-icon">🎭</span>NPCs</button>
  <button class="nav-tab" onclick="showTab('orgs')" id="tab-orgs"><span class="nav-icon">🏰</span>Organizações</button>
  <button class="nav-tab" onclick="showTab('monsters')" id="tab-monsters"><span class="nav-icon">👾</span>Monstros</button>
  <div style="margin-left:auto; display:flex;">
    <button class="nav-tab" onclick="showTab('profile')" id="tab-profile" style="display:none;"><span class="nav-icon">👤</span>Meu Perfil</button>
    <button class="nav-tab" onclick="showTab('pending')" id="tab-pending" style="display:none; border-color:var(--red-wax);"><span class="nav-icon">📋</span>Fichas Pendentes<span id="pending-alert-dot" class="pending-alert" style="display:none;">!</span></button>
    <button class="nav-tab" onclick="handleLogout()" id="tab-logout" style="border-color:var(--red-wax);color:var(--red-wax);"><span class="nav-icon">🚪</span>Sair</button>
  </div>
</nav>

<main id="main-tabs-container"></main>
<script>
  document.getElementById('main-tabs-container').outerHTML = KENSWORD_TEMPLATES.tabContents;
</script>

<footer>
  <p>⚔️ <em>Kensword Chronicles</em> — Compêndio do Aventureiro &nbsp;|&nbsp; Que sua lâmina seja afiada e sua magia, certeira. ⚔️</p>
</footer>

<div id="char-sheet-modal" class="modal-overlay" style="display:none;">
  <div class="modal-content parchment-panel" style="max-width:700px; position:relative;">
    <button onclick="closeCharacterSheet()" class="close-btn" style="position:absolute; top:10px; right:15px; font-size:1.8rem; background:none; border:none; cursor:pointer; color:var(--red-wax);">&times;</button>
    <div id="char-sheet-body"></div>
  </div>
</div>
